[package]
name = "nada"
version = "0.1.0"
authors = ["Daniel Petri <daniel.petri@tum.de>"]
edition = "2021"
license = "AGPL-3.0-only"
default-run = "nada"

[[bin]]
name = "nada"
path = "src/bin/nada.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
futures = "0.3"
tokio-quiche = { version = "0.20.1", features = ["capture_keylogs", "zero-copy", "gcongestion"]}
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
boring = "5.3"
sfv = "0.16.0"
foundations = {version = "5.6.5", default-features = false, features = [
  "logging"
] }
octets = "0.3.0"
serde_json = "1.0"

[dev-dependencies]
url = "2.5"
