[package]
name = "nada"
version = "0.1.0"
authors = ["Daniel Petri <daniel.petri@tum.de>"]
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "masque-client"
path = "src/bin/masque-client.rs"

[[bin]]
name = "masque-proxy"
path = "src/bin/masque-proxy.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
log = { version = "0.4.20" }
tokio-quiche = { version = "0.20.1", features = ["capture_keylogs", "zero-copy", "gcongestion"]}
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
quiche = { version = "0.30.0", features = ["qlog", "gcongestion"] }
sfv = "0.14.0"
foundations = {version = "5.3.0", default-features = false, features = [
  "logging"
] }
octets = "0.3.0"
serde_json = "1.0"
bytes = "1.11.1"
