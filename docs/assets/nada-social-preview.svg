<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Nada</title>
  <desc id="description">The network relay for an agentic Internet. Faint transport lines converge around the empty-set symbol and Nada wordmark.</desc>
  <style>
    .wordmark { fill: currentColor; }
    .tagline { fill: currentColor; opacity: .7; }
    .symbol { stroke: currentColor; }
    .flows { stroke: currentColor; opacity: .2; }
    .theme-dark { display: none; }
    text {
      font-family: Arial, Helvetica, sans-serif;
      text-anchor: middle;
    }

    @media (prefers-color-scheme: dark) {
      .theme-light { display: none; }
      .theme-dark { display: inline; }
    }
  </style>

  <defs>
    <linearGradient id="flow-opacity" x1="0" y1="0" x2="446" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset=".65" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="flow-fade" x="-20" y="0" width="466" height="640" maskUnits="userSpaceOnUse">
      <rect x="-20" width="466" height="640" fill="url(#flow-opacity)"/>
    </mask>
    <g id="artwork">
      <g class="flows" fill="none" stroke-width=".8">
        <g id="transport-lines" mask="url(#flow-fade)">
          <path d="M -20 60 C 204 60 169 289 446 289"/>
          <path d="M -20 98 C 208 98 178 294 446 294"/>
          <path d="M -20 135 C 210 135 186 299 446 299"/>
          <path d="M -20 171 C 212 171 194 304 446 304"/>
          <path d="M -20 205 C 214 205 203 309 446 309"/>
          <path d="M -20 238 C 216 238 211 314 446 314"/>
          <path d="M -20 287 C 216 287 211 319 446 319"/>
          <path d="M -20 321 C 216 321 211 324 446 324"/>
          <path d="M -20 355 C 216 355 211 329 446 329"/>
          <path d="M -20 389 C 214 389 203 334 446 334"/>
          <path d="M -20 423 C 212 423 194 339 446 339"/>
          <path d="M -20 456 C 210 456 186 344 446 344"/>
          <path d="M -20 490 C 208 490 178 349 446 349"/>
          <path d="M -20 525 C 204 525 169 354 446 354"/>
        </g>
        <use href="#transport-lines" transform="translate(1280 0) scale(-1 1)"/>
      </g>

      <g class="symbol" fill="none" stroke-width="11">
        <circle cx="640" cy="187" r="58"/>
        <path d="M 579 246 L 701 124"/>
      </g>

      <text class="wordmark" x="640" y="390" font-size="154" font-weight="700" letter-spacing="-7">Nada</text>
      <text class="tagline" x="640" y="460" font-size="40">The network relay for an agentic Internet</text>
    </g>
  </defs>

  <g class="theme-light" color="#101418">
    <rect width="1280" height="640" fill="#fff"/>
    <use href="#artwork"/>
  </g>
  <g class="theme-dark" color="#f0f6fc">
    <rect width="1280" height="640" fill="#0d1117"/>
    <use href="#artwork"/>
  </g>
</svg>
