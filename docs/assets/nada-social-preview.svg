<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Nada</title>
  <desc id="description">The relay for an agentic Internet. Layered curved transport lines form a tunnel gradient around the empty-set symbol and Nada wordmark.</desc>
  <style>
    .wordmark { fill: currentColor; }
    .tagline { fill: currentColor; opacity: .7; }
    .symbol { fill: currentColor; }
    .flows { stroke: currentColor; }
    .theme-dark { display: none; }
    text {
      font-family: Arial, Helvetica, sans-serif;
      text-anchor: middle;
    }
    .brand text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      .theme-light { display: none; }
      .theme-dark { display: inline; }
    }
  </style>

  <defs>
    <linearGradient id="flow-opacity" x1="0" y1="0" x2="446" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset=".65" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="flow-fade" x="-20" y="0" width="466" height="640" maskUnits="userSpaceOnUse">
      <rect x="-20" width="466" height="640" fill="url(#flow-opacity)"/>
    </mask>
    <g id="artwork">
      <g class="flows" fill="none" stroke-linecap="round">
        <g id="transport-lines" mask="url(#flow-fade)">
          <path d="M -40 -64 C 180 -64 88 250 446 250" stroke-width="6" opacity=".16"/>
          <path d="M -40 28 C 184 28 128 270 446 270" stroke-width="8" opacity=".26"/>
          <path d="M -40 120 C 188 120 168 290 446 290" stroke-width="10" opacity=".42"/>
          <path d="M -40 212 C 192 212 208 310 446 310" stroke-width="12" opacity=".6"/>
          <path d="M -40 428 C 192 428 208 330 446 330" stroke-width="12" opacity=".6"/>
          <path d="M -40 520 C 188 520 168 350 446 350" stroke-width="10" opacity=".42"/>
          <path d="M -40 612 C 184 612 128 370 446 370" stroke-width="8" opacity=".26"/>
          <path d="M -40 704 C 180 704 88 390 446 390" stroke-width="6" opacity=".16"/>
        </g>
        <use href="#transport-lines" transform="translate(1280 0) scale(-1 1)"/>
      </g>

      <g class="brand" transform="translate(293.5 74.3) scale(1.925)">
        <text class="symbol" x="180" y="64" font-size="56" font-weight="200">∅</text>
        <text class="wordmark" x="180" y="156" font-size="80" font-weight="400" letter-spacing="-4.4">Nada</text>
      </g>

      <text class="tagline" x="640" y="460" font-size="40">The relay for an agentic Internet</text>
    </g>
  </defs>

  <g class="theme-light" color="#101418">
    <rect width="1280" height="640" fill="#fff"/>
    <use href="#artwork"/>
  </g>
  <g class="theme-dark" color="#f0f6fc">
    <rect width="1280" height="640" fill="#0d1117"/>
    <use href="#artwork"/>
  </g>
</svg>
